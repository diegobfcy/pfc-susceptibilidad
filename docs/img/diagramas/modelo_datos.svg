      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="940" height="370" fill="#fff"/>
  <g fill="#f1f5f9" stroke="#64748b">
    <rect x="25" y="30" width="250" height="54" rx="5"/>
    <rect x="345" y="30" width="250" height="54" rx="5"/>
    <rect x="665" y="30" width="250" height="54" rx="5"/>
    <rect x="25" y="150" width="250" height="54" rx="5"/>
    <rect x="345" y="150" width="250" height="54" rx="5"/>
    <rect x="665" y="150" width="250" height="54" rx="5"/>
    <rect x="345" y="270" width="250" height="54" rx="5"/>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#flecha)">
    <path d="M275 57 H345"/>
