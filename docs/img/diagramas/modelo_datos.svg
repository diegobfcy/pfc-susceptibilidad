<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" role="img" aria-labelledby="title desc">
  <title id="title">Relaciones del modelo de datos principal</title>
  <desc id="desc">Rol tiene usuarios; usuario tiene procesamientos y eventos; procesamiento tiene eventos. Modelo, procesamiento, celda y susceptibilidad se relacionan por identificadores.</desc>
