[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pfc-susceptibilidad"
version = "0.1.0"
description = "Sistema de estimación de la susceptibilidad a deslizamientos por El Niño en el norte del Perú"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.3.3", "numpy==2.3.5", "pyarrow==25.0.0", "pyyaml==6.0.3", "requests==2.34.2",
  "xgboost==3.2.0", "scikit-learn==1.9.1", "joblib==1.6.0", "flask==3.1.3",
  "argon2-cffi==25.1.0", "sqlalchemy==2.1.6", "psycopg[binary]==3.3.4", "gunicorn==26.2.0",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0", "rasterio>=1.4", "xarray>=2025.1", "netcdf4>=1.7", "cdsapi>=0.7", "matplotlib>=3.9"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.2", "black==26.10.1",
       "import-linter==2.15", "pip-audit", "pre-commit", "openapi-spec-validator"]

[tool.setuptools.packages.find]
where = ["servicios", "etl", "predictiva", "datos"]
include = ["pfc_*"]

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "ANN001", "ANN201", "BLE"]
ignore = ["N803", "N806"]   # X, Xv: notación matemática habitual en ML

[tool.pytest.ini_options]
testpaths = ["pruebas"]
pythonpath = ["servicios", "etl", "predictiva", "datos"]
addopts = "-q"
markers = ["integracion: requiere PostgreSQL/PostGIS (variable PFC_BD_URL)"]

[tool.coverage.run]
source = ["pfc_servicios", "pfc_etl", "pfc_predictiva", "pfc_datos"]

[tool.importlinter]
root_packages = ["pfc_servicios", "pfc_etl", "pfc_predictiva", "pfc_datos"]

[[tool.importlinter.contracts]]
name = "Arquitectura en capas: Servicios/ETL/Predictiva -> Datos"
type = "layers"
layers = ["pfc_servicios | pfc_etl | pfc_predictiva", "pfc_datos"]

[[tool.importlinter.contracts]]
name = "Predictiva no depende de ETL (lee la matriz desde D2)"
type = "forbidden"
source_modules = ["pfc_predictiva"]
forbidden_modules = ["pfc_etl", "pfc_servicios"]
