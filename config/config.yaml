# Configuración central (RF-05, RF-06 y RNF-02). Los valores ajustables viven aquí, no en el código.
proyecto: pfc-susceptibilidad
periodo:
  inicio: "2000-01-01"
  fin: "2026-08-31"
dominio:                          # macrorregión norte (vertiente del Pacífico)
  lon_min: -81.5249
  lon_max: -76.6030
  lat_min: -10.9169
  lat_max: -3.3500
  area_cds: [-3.30, -81.53, -10.92, -76.60]   # N, W, S, E
celda_m: 1000
semilla: 42
hosts_permitidos:                 # lista blanca de dominios oficiales (OWASP A10)
  - www.cpc.ncep.noaa.gov
  - cds.climate.copernicus.eu
  - copernicus-dem-30m.s3.amazonaws.com
  - geocatmin.ingemmet.gob.pe
http:
  user_agent: "pfc-susceptibilidad/0.1 (investigacion academica UCSM)"
  tiempo_espera_s: [10, 300]      # conexión, lectura
verificacion:                     # reglas RF-06 por fuente
  tolerancia_flotante: 1.0e-9
  fuentes:
    ersst_v5:
      columnas: [anio, mes, n12, n12_anom]
      rango: {n12: [-2.0, 40.0], n12_anom: [-6.0, 6.0]}
      frecuencia: MS
    era5_land:
      columnas: [fecha, id_pixel, p1]
      rango: {p1: [0.0, 500.0]}
      frecuencia: D
    dem_glo30:
      columnas: [id_celda, pend_media, pend_p90, pend_max]
      rango: {pend_media: [0.0, 90.0], pend_p90: [0.0, 90.0], pend_max: [0.0, 90.0]}
    inventario:
      columnas: [event_uid, fecha, date_precision, id_celda]
      rango: {}
particion:                        # Tabla 62 ajustada al periodo disponible
  fin_entrenamiento: 2016
  validacion: [2017, 2019]
  prueba: [2020, 2026]            # sellada: no se lee hasta la actividad 2.3
modelo:
  umbral_auc_minimo: 0.80
  bloque_espacial_km: 50
  pliegues: 5
  submuestreo_negativos_busqueda: 0.10
  grilla:
    max_depth: [4, 6, 8]
    learning_rate: [0.05, 0.10]
    min_child_weight: [1, 5]
deriva:
  variables: [precip_max3d_mm, precip_ant90_mm, anom_tsm]
  psi_vigilancia: 0.10
  psi_alerta: 0.25
  brecha_maxima: 0.05
