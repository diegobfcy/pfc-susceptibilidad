repos:
  - repo: local
    hooks:
      - {id: black, name: black, entry: black --check, language: system, types: [python]}
      - {id: ruff, name: ruff, entry: ruff check, language: system, types: [python]}
      - {id: import-linter, name: contrato de capas, entry: lint-imports, language: system, pass_filenames: false}
