# Proxy del entorno de pruebas: misma política de TLS y cabeceras que despliegue/nginx/pfc.conf.
worker_processes 1;
pid @BASE@/nginx/nginx.pid;
events { worker_connections 512; }
http {
    include       @BASE@/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    @BASE@/logs/nginx_acceso.log;
    client_body_temp_path @BASE@/nginx/temp/body;
    proxy_temp_path       @BASE@/nginx/temp/proxy;
    fastcgi_temp_path     @BASE@/nginx/temp/fastcgi;
    uwsgi_temp_path       @BASE@/nginx/temp/uwsgi;
    scgi_temp_path        @BASE@/nginx/temp/scgi;
    limit_req_zone $binary_remote_addr zone=acceso:1m rate=30r/m;
    server {
        listen 127.0.0.1:8444 ssl;
        http2 on;
        server_name localhost;
        ssl_certificate     @RAIZ@/despliegue/nginx/tls/pfc.crt;
        ssl_certificate_key @RAIZ@/despliegue/nginx/tls/pfc.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_tokens off;
        client_max_body_size 16k;
        gzip on;
        gzip_types application/json application/vnd.mapbox-vector-tile text/css application/javascript;
        gzip_min_length 512;
        root @RAIZ@/presentacion;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        # Sin Cross-Origin-Embedder-Policy: bloquearía las teselas del mapa base de OpenStreetMap.
        # La API también las emite; sin esto el cliente las recibe duplicadas.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        location = / { return 302 /visor/; }
        location /comun/ { try_files $uri =404; }
        location /visor/ { try_files $uri $uri/ /visor/index.html; }
        location /panel/ { try_files $uri $uri/ /panel/index.html; }
        location = /api/auth/login {
            limit_req zone=acceso burst=10 nodelay;
            limit_req_status 429;
            error_page 429 @limite_acceso;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ~ ^/api/ingestas/\d+/archivos$ {
            # nginx corta aquí: si la API rechaza sin leer el cuerpo, el cliente recibiría 502.
            client_max_body_size 2048m;
            error_page 413 =422 @carga_excedida;
            proxy_request_buffering off;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location @carga_excedida {
            default_type application/json;
            return 422 '{"error":"Unprocessable Entity","detalle":"el archivo supera el límite de 2 GB"}';
        }
        location @limite_acceso {
            default_type application/json;
            return 429 '{"error":"Too Many Requests","detalle":"demasiados intentos; espere un minuto"}';
        }
        location @cuerpo_excedido {
            default_type application/json;
            return 413 '{"error":"Request Entity Too Large","detalle":"la solicitud supera 16 KB"}';
        }
        location @api_no_disponible {
            default_type application/json;
            return 502 '{"error":"Bad Gateway","detalle":"el servicio no está disponible"}';
        }
        location = /api { return 301 /api/; }
        location /api/ {
            # Los errores que genera nginx también responden en JSON, como los de la API.
            error_page 413 @cuerpo_excedido;
            error_page 502 504 @api_no_disponible;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
