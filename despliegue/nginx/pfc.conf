# Contenedor proxy: TLS, archivos estáticos de la capa de Presentación y proxy inverso a la API
server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/tls/pfc.crt;
    ssl_certificate_key /etc/nginx/tls/pfc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;

    root /usr/share/nginx/html;
    location = / { return 302 /visor/; }
    location /visor/ { try_files $uri $uri/ /visor/index.html; }
    location /panel/ { try_files $uri $uri/ /panel/index.html; }
    # Resolución en cada solicitud: si app se recrea con otra IP, el proxy no queda apuntando
    # a la anterior (DNS interno de Docker).
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api http://app:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
