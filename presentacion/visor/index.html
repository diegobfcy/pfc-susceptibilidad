<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Susceptibilidad a deslizamientos – Norte del Perú</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/visor.css">
</head>
<body>
<header class="barra">
  <div class="titulo">
    <strong>Susceptibilidad a deslizamientos</strong>
    <span>El Niño · Macrorregión norte del Perú</span>
  </div>
  <nav class="pestanas">
    <a id="enlace-panel" class="boton" href="/panel/" hidden>Panel</a>
    <button id="salir" type="button" hidden>Cerrar sesión</button>
  </nav>
</header>
<div id="acceso" class="acceso" hidden>
  <form id="form-acceso" class="tarjeta formulario" method="post">
    <h1>Iniciar sesión</h1>
    <label class="campo">Correo <input type="email" name="correo" autocomplete="username" required maxlength="150"></label>
    <label class="campo">Clave <input type="password" name="clave" autocomplete="current-password" required maxlength="128"></label>
    <button type="submit" class="primario">Entrar</button>
    <p id="acceso-mensaje" class="aviso" role="alert"></p>
  </form>
</div>
<main>
  <section id="panel-mapa" class="panel activo">
    <aside class="lateral">
      <label class="campo">Periodo
        <input type="month" id="sel-periodo" min="2000-02" max="2026-08" aria-describedby="aviso-periodo">
      </label>
      <p id="aviso-periodo" class="aviso" role="status" hidden></p>
      <label class="campo">Departamento
        <select id="sel-departamento"><option value="">Toda la macrorregión</option></select>
      </label>
      <label class="campo">Provincia
        <select id="sel-provincia"><option value="">Todas</option></select>
      </label>
      <fieldset class="campo">
        <legend>Capas</legend>
        <label class="check"><input type="checkbox" id="capa-susceptibilidad" checked> Susceptibilidad</label>
        <p id="error-susceptibilidad" class="aviso" role="status" hidden></p>
        <label class="check"><input type="checkbox" id="capa-inventario"> Inventario de deslizamientos</label>
        <p id="error-inventario" class="aviso" role="status" hidden></p>
        <label class="check"><input type="checkbox" id="capa-precipitacion"> Precipitación mensual</label>
        <p id="error-precipitacion" class="aviso" role="status" hidden></p>
        <label class="check"><input type="checkbox" id="capa-tsm"> Anomalía de TSM (Niño 1+2)</label>
        <p id="error-tsm" class="aviso" role="status" hidden></p>
        <label class="check"><input type="checkbox" id="capa-pendiente"> Pendiente del terreno</label>
        <p id="error-pendiente" class="aviso" role="status" hidden></p>
        <label class="check"><input type="checkbox" id="capa-limites" checked> Límites provinciales</label>
        <p id="error-limites" class="aviso" role="status" hidden></p>
      </fieldset>
      <label class="campo">Paleta
        <select id="sel-paleta">
          <option value="estandar">Estándar (verde a rojo)</option>
          <option value="accesible">Accesible (YlOrBr)</option>
        </select>
      </label>
      <div class="leyenda" id="leyenda"></div>
      <p class="nota">El puntaje ordena las celdas por susceptibilidad relativa: no es la probabilidad calibrada de que ocurra un evento.</p>
      <p id="error-general" class="aviso" role="alert" hidden></p>
    </aside>
    <div id="mapa" aria-label="Mapa de susceptibilidad"></div>
  </section>
</main>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/leaflet.vectorgrid.bundled.min.js"></script>
<script type="module" src="js/mapa.js"></script>
</body>
</html>
