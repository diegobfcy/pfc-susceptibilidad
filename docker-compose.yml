# Entorno de pruebas (staging): proxy, app, worker y db. Las imágenes se identifican con el
# commit (PFC_VERSION) y se publican en el registro local de imágenes.
name: pfc-staging
services:
  db:
    image: ${PFC_REGISTRO:-localhost:5000}/pfc-db:${PFC_VERSION:-latest}  # PostgreSQL 18.6 y PostGIS 3.7.0
    environment:
      POSTGRES_DB: pfc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
    volumes:
      - pgdata:/var/lib/postgresql  # PostgreSQL 18: los datos quedan en 18/docker
      - ./datos/sql/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ./datos/sql/02_operacion.sql:/docker-entrypoint-initdb.d/02_operacion.sql:ro
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pfc"]
      interval: 5s
      retries: 20
  app:
    image: ${PFC_REGISTRO:-localhost:5000}/pfc-app:${PFC_VERSION:-latest}
    environment:
      PFC_BD_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/pfc
      PFC_SECRETO_SESION: ${PFC_SECRETO_SESION:?definir en .env}
      PFC_D2: /datos/d2  # cargas manuales y comprobación de la matriz (RF-02, RF-06)
    volumes:
      - d2:/datos/d2
    depends_on: {db: {condition: service_healthy}}
  worker:
    image: ${PFC_REGISTRO:-localhost:5000}/pfc-worker:${PFC_VERSION:-latest}
    restart: unless-stopped  # un error no previsto marca el trabajo FALLIDO y reinicia el worker
    environment:
      PFC_BD_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/pfc
      PFC_DATOS_ORIGEN: /datos/origen
      PFC_D2: /datos/d2
    volumes:
      - ${PFC_DATOS_ORIGEN:?definir en .env}:/datos/origen:ro
      - d2:/datos/d2
    depends_on: {db: {condition: service_healthy}}
  worker-m2:
    image: ${PFC_REGISTRO:-localhost:5000}/pfc-worker:${PFC_VERSION:-latest}
    command: ["python", "-m", "pfc_predictiva.inferencia.trabajador"]
    restart: unless-stopped
    environment:
      PFC_BD_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/pfc
      PFC_D2: /datos/d2
      PFC_DISPOSITIVO_XGB: cpu
    volumes:
      - d2:/datos/d2
    depends_on: {db: {condition: service_healthy}}
  proxy:
    image: ${PFC_REGISTRO:-localhost:5000}/pfc-proxy:${PFC_VERSION:-latest}  # nginx 1.30.6 parcheado
    volumes:
      - ./despliegue/nginx/pfc.conf:/etc/nginx/conf.d/default.conf:ro
      - ./despliegue/nginx/tls:/etc/nginx/tls:ro
      - ./presentacion:/usr/share/nginx/html:ro
    ports: ["127.0.0.1:8443:443"]
    depends_on: [app]
volumes:
  pgdata:
  d2:
